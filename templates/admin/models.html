{% extends "admin/base.html" %}

{% block title %}模型管理 - 申论帮{% endblock %}
{% block page_title %}模型管理{% endblock %}

{% block extra_css %}
<style>
  .model-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    margin-bottom: var(--space-3);
  }
  .model-toolbar-status, .model-actions, .model-form-flags {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .model-actions { gap: 4px; white-space: nowrap; }
  .model-icon-button {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--table-border);
    border-radius: var(--radius-sm);
    background: #fff;
    color: var(--color-text-secondary);
    cursor: pointer;
  }
  .model-icon-button:hover { color: var(--color-primary); border-color: var(--color-primary); }
  .model-icon-button.danger:hover { color: var(--color-error); border-color: var(--color-error); }
  .model-icon-button i { width: 16px; height: 16px; }
  .model-empty { padding: var(--space-4); text-align: center; color: var(--color-text-secondary); }
  .model-form-flags { gap: var(--space-3); flex-wrap: wrap; }
  .model-form-flag { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-sm); }
  @media (max-width: 900px) {
    .admin-table-container { overflow-x: auto; }
    .admin-table { min-width: 900px; }
  }
</style>
{% endblock %}

{% block admin_content %}
<div class="model-toolbar">
  <div class="model-toolbar-status">
    <span id="model-count" class="status-badge status-draft">0 个模型</span>
    <span id="model-access" class="status-badge status-draft" hidden>只读</span>
  </div>
  <button id="add-model-button" class="btn btn-primary" type="button"
          data-super-admin-only hidden onclick="openModelForm()">
    <i data-lucide="plus"></i>
    新增模型
  </button>
</div>

<div class="admin-table-container">
  <table class="admin-table" aria-label="模型列表">
    <thead>
      <tr>
        <th>名称</th><th>协议</th><th>模型</th><th>价格(次)</th>
        <th>权重</th><th>状态</th><th>最近测试</th><th>操作</th>
      </tr>
    </thead>
    <tbody id="models-table-body">
      <tr><td colspan="8" class="model-empty">加载中</td></tr>
    </tbody>
  </table>
</div>

<template id="model-form-template">
  <form id="model-form">
    <div class="admin-form-row">
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-name">名称</label>
        <input id="model-name" class="admin-form-input" name="name" required maxlength="100">
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-protocol">协议</label>
        <select id="model-protocol" class="admin-form-input" name="protocol" required>
          <option value="openai">OpenAI Chat Completions</option>
          <option value="anthropic">Anthropic Messages</option>
        </select>
      </div>
    </div>
    <div class="admin-form-row">
      <div class="admin-form-group full-width">
        <label class="admin-form-label" for="model-base-url">API URL</label>
        <input id="model-base-url" class="admin-form-input" name="base_url" type="url" required>
      </div>
    </div>
    <div class="admin-form-row">
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-name-value">模型名</label>
        <input id="model-name-value" class="admin-form-input" name="model_name" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-api-key">API Key</label>
        <input id="model-api-key" class="admin-form-input" name="api_key" type="password" autocomplete="new-password">
      </div>
    </div>
    <div class="admin-form-row">
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-weight">权重</label>
        <input id="model-weight" class="admin-form-input" name="weight" type="number" min="0.01" step="0.01" value="1" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-credit-cost">批改消耗（次）</label>
        <input id="model-credit-cost" class="admin-form-input" name="credit_cost" type="number" min="0" step="0.5" value="1">
        <span class="admin-form-hint">0=免费，0.5半价，1=标准，2=高价</span>
      </div>
    </div>
    <div class="admin-form-row">
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-input-price">输入价格（元/百万Token）</label>
        <input id="model-input-price" class="admin-form-input" name="input_price_per_mtok" type="number" min="0" step="0.1" value="0">
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-output-price">输出价格（元/百万Token）</label>
        <input id="model-output-price" class="admin-form-input" name="output_price_per_mtok" type="number" min="0" step="0.1" value="0">
        <span class="admin-form-hint">用于计算 Token 消耗成本</span>
      </div>
    </div>
    <div class="admin-form-row admin-form-row-3">
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-priority">优先级</label>
        <input id="model-priority" class="admin-form-input" name="priority" type="number" min="0" step="1" value="100" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-timeout">超时（秒）</label>
        <input id="model-timeout" class="admin-form-input" name="timeout_seconds" type="number" min="5" max="300" step="5" value="120" required>
      </div>
      <div class="admin-form-group">
        <label class="admin-form-label" for="model-max-tokens">最大 Tokens（0=不限制）</label>
        <input id="model-max-tokens" class="admin-form-input" name="max_tokens" type="number" min="0" max="200000" step="1" value="0" required>
      </div>
    </div>
    <div class="model-form-flags">
      <label class="model-form-flag"><input name="enabled" type="checkbox" checked>启用</label>
      <label class="model-form-flag"><input name="public_visible" type="checkbox">对用户开放</label>
    </div>
    <div class="admin-form-actions">
      <button class="btn btn-ghost" type="button" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" type="submit">保存</button>
    </div>
  </form>
</template>
{% endblock %}

{% block extra_js %}
<script>
  let models = [];
  let canWrite = false;

  function modelStatus(model) {
    if (!model.enabled) return '<span class="status-badge status-draft">停用</span>';
    if (model.public_visible) return '<span class="status-badge status-active">公开</span>';
    return '<span class="status-badge status-pending">内部</span>';
  }

  function testStatus(model) {
    if (!model.last_test_status) return '-';
    const style = model.last_test_status === 'success' ? 'status-active' : 'status-rejected';
    const label = model.last_test_status === 'success' ? '通过' : escapeHtml(model.last_test_error || '失败');
    const latency = model.last_latency_ms == null ? '' : ` · ${model.last_latency_ms} ms`;
    return `<span class="status-badge ${style}">${label}${latency}</span>`;
  }

  function actionButtons(model) {
    if (!canWrite) return '-';
    const modelId = encodeURIComponent(model.model_id);
    return `<div class="model-actions" data-super-admin-only>
      <button class="model-icon-button" type="button" data-action="test" data-model-id="${modelId}" title="测试连接" aria-label="测试连接"><i data-lucide="plug-zap"></i></button>
      <button class="model-icon-button" type="button" data-action="edit" data-model-id="${modelId}" title="编辑" aria-label="编辑"><i data-lucide="pencil"></i></button>
      <button class="model-icon-button danger" type="button" data-action="delete" data-model-id="${modelId}" title="删除" aria-label="删除"><i data-lucide="trash-2"></i></button>
    </div>`;
  }

  function renderModels() {
    const body = document.getElementById('models-table-body');
    document.getElementById('model-count').textContent = `${models.length} 个模型`;
    document.getElementById('model-access').hidden = canWrite;
    document.getElementById('add-model-button').hidden = !canWrite;
    if (!models.length) {
      body.innerHTML = '<tr><td colspan="8" class="model-empty">暂无模型</td></tr>';
      return;
    }
    body.innerHTML = models.map(model => `<tr>
      <td>${escapeHtml(model.name)}</td><td>${escapeHtml(model.protocol)}</td>
      <td>${escapeHtml(model.model_name)}</td>
      <td>
        <span style="font-weight:600;color:#6366f1;">${model.credit_cost != null ? model.credit_cost : '-'}次</span>
        ${model.input_price_per_mtok != null ? `<div style="font-size:11px;color:#9ca3af;">入¥${model.input_price_per_mtok} / 出¥${model.output_price_per_mtok} /M</div>` : ''}
      </td>
      <td>${model.weight}</td>
      <td>${modelStatus(model)}</td><td>${testStatus(model)}</td><td>${actionButtons(model)}</td>
    </tr>`).join('');
    lucide.createIcons();
  }

  async function loadModels() {
    try {
      const response = await adminFetch('/models');
      models = response.data.models;
      canWrite = response.data.can_write;
      renderModels();
    } catch (error) { showToast(error.message, 'error'); }
  }

  function openModelForm(modelId = null) {
    if (!canWrite) return;
    const model = models.find(item => item.model_id === modelId);
    openModal(model ? '编辑模型' : '新增模型', document.getElementById('model-form-template').innerHTML);
    const form = document.getElementById('model-form');
    if (model) {
      for (const field of ['name', 'protocol', 'base_url', 'model_name', 'weight', 'credit_cost', 'priority', 'timeout_seconds', 'max_tokens', 'input_price_per_mtok', 'output_price_per_mtok']) {
        form.elements[field].value = model[field] ?? '';
      }
      form.elements.enabled.checked = model.enabled;
      form.elements.public_visible.checked = model.public_visible;
    } else {
      form.elements.api_key.required = true;
    }
    form.addEventListener('submit', event => saveModel(event, modelId));
  }

  async function saveModel(event, modelId) {
    event.preventDefault();
    if (!canWrite) return;
    const form = event.currentTarget;
    const payload = Object.fromEntries(new FormData(form));
    payload.weight = Number(payload.weight);
    payload.credit_cost = parseFloat(payload.credit_cost) || 1.0;
    payload.input_price_per_mtok = parseFloat(payload.input_price_per_mtok) || 0;
    payload.output_price_per_mtok = parseFloat(payload.output_price_per_mtok) || 0;
    for (const field of ['priority', 'timeout_seconds', 'max_tokens']) payload[field] = Number(payload[field]);
    payload.enabled = form.elements.enabled.checked;
    payload.public_visible = form.elements.public_visible.checked;
    if (!payload.api_key) delete payload.api_key;
    try {
      const url = modelId ? `/models/${encodeURIComponent(modelId)}` : '/models';
      const options = modelId
        ? { method: 'PUT', body: JSON.stringify(payload) }
        : { method: 'POST', body: JSON.stringify(payload) };
      await adminFetch(url, options);
      closeModal();
      showToast('模型已保存');
      await loadModels();
    } catch (error) { showToast(error.message, 'error'); }
  }

  async function testModel(modelId) {
    if (!canWrite) return;
    try {
      const response = await adminFetch(`/models/${encodeURIComponent(modelId)}/test`, { method: 'POST' });
      showToast(response.data.success ? '连接成功' : `连接失败：${response.data.error_category}`, response.data.success ? 'success' : 'error');
      await loadModels();
    } catch (error) { showToast(error.message, 'error'); }
  }

  function editModel(modelId) { openModelForm(modelId); }

  async function deleteModel(modelId) {
    if (!canWrite || !confirm('确定删除这个模型？')) return;
    try {
      await adminFetch(`/models/${encodeURIComponent(modelId)}`, { method: 'DELETE' });
      showToast('模型已删除');
      await loadModels();
    } catch (error) { showToast(error.message, 'error'); }
  }

  document.getElementById('models-table-body').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const modelId = decodeURIComponent(button.dataset.modelId);
    if (button.dataset.action === 'test') testModel(modelId);
    if (button.dataset.action === 'edit') editModel(modelId);
    if (button.dataset.action === 'delete') deleteModel(modelId);
  });

  loadModels();
</script>
{% endblock %}
