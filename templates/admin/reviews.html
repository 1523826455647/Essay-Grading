{% extends "admin/base.html" %}

{% block title %}批改复核 - 申论帮管理后台{% endblock %}
{% block page_title %}批改复核{% endblock %}

{% block admin_content %}
<!-- 筛选栏 -->
<div class="filter-bar">
  <div class="filter-item">
    <label>状态</label>
    <select id="filter-status" onchange="loadReviews()">
      <option value="">全部</option>
      <option value="pending">待复核</option>
      <option value="approved">已确认</option>
      <option value="rejected">已拒绝</option>
    </select>
  </div>
  <div class="filter-item">
    <label>分数段</label>
    <select id="filter-score" onchange="loadReviews()">
      <option value="">全部</option>
      <option value="0-60">60分以下</option>
      <option value="60-75">60-75分</option>
      <option value="75-90">75-90分</option>
      <option value="90-100">90分以上</option>
    </select>
  </div>
  <div class="filter-item">
    <label>搜索</label>
    <input type="text" id="filter-search" placeholder="用户名/试卷标题" onkeyup="if(event.key==='Enter')loadReviews()">
  </div>
  <button class="btn btn-primary" onclick="loadReviews()"><i data-lucide="search"></i> 搜索</button>
</div>

<!-- 复核列表 -->
<div class="admin-table-container">
  <div class="admin-table-header">
    <h3 class="admin-table-title">批改复核</h3>
  </div>
  <table class="admin-table">
    <thead>
      <tr>
        <th>提交ID</th>
        <th>用户</th>
        <th>试卷</th>
        <th>题目</th>
        <th>AI得分</th>
        <th>状态</th>
        <th>提交时间</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="reviews-table">
      <tr><td colspan="8" style="text-align: center;">加载中...</td></tr>
    </tbody>
  </table>
  <div class="admin-pagination">
    <div class="pagination-info" id="pagination-info">共 0 条</div>
    <div class="pagination-buttons" id="pagination-buttons"></div>
  </div>
</div>

<!-- 复核详情模态框 -->
<div id="review-modal" class="admin-modal">
  <div class="admin-modal-content" style="max-width: 900px; max-height: 90vh; display: flex; flex-direction: column;">
    <div class="admin-modal-header">
      <h3 class="admin-modal-title" id="modal-title">复核详情</h3>
      <button class="admin-modal-close" onclick="closeReviewModal()">&times;</button>
    </div>
    <div id="modal-body" style="overflow-y: auto; padding: 20px;">
      <!-- 动态内容 -->
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let currentPage = 1;
  let currentSubmission = null;

  async function loadReviews(page = 1) {
    currentPage = page;
    const status = document.getElementById('filter-status').value;
    const score = document.getElementById('filter-score').value;
    const search = document.getElementById('filter-search').value;

    const params = new URLSearchParams({ page, limit: 20 });
    if (status) params.append('status', status);
    if (score) params.append('score', score);
    if (search) params.append('search', search);

    try {
      const data = await adminFetch(`/submissions/pending_review?${params}`);
      renderReviews(data.data);
    } catch (e) {
      document.getElementById('reviews-table').innerHTML =
        '<tr><td colspan="8" style="text-align: center;">加载失败</td></tr>';
    }
  }

  function renderReviews(data) {
    const tbody = document.getElementById('reviews-table');
    if (!data.submissions || data.submissions.length === 0) {
      tbody.innerHTML = '<tr><td colspan="8" style="text-align: center;">暂无数据</td></tr>';
      return;
    }

    const statusMap = {
      'pending': '<span class="status-badge status-pending">待复核</span>',
      'approved': '<span class="status-badge status-active">已确认</span>',
      'rejected': '<span class="status-badge status-rejected">已拒绝</span>'
    };

    tbody.innerHTML = data.submissions.map(s => `
      <tr>
        <td style="font-family:monospace;font-size:12px;">${escapeHtml((s.sid || '').slice(-12))}</td>
        <td>${escapeHtml(s.nickname || s.username || '-')}</td>
        <td>${escapeHtml((s.paper_title || '').slice(0, 30))}</td>
        <td>${escapeHtml((s.question_stem || '').slice(0, 20))}...</td>
        <td style="font-weight:600;">${s.score != null ? s.score : '--'}</td>
        <td>${statusMap[s.review_status || 'pending'] || statusMap['pending']}</td>
        <td style="white-space:nowrap;">${formatDate(s.created_at)}</td>
        <td><button class="action-btn action-btn-view" onclick="viewReview('${s.sid}')">查看</button></td>
      </tr>
    `).join('');

    // Pagination
    const info = document.getElementById('pagination-info');
    const container = document.getElementById('pagination-buttons');
    info.textContent = `共 ${data.total} 条`;
    if (data.pages > 1) {
      let html = '';
      for (let i = 1; i <= data.pages; i++) {
        html += `<button class="pagination-btn ${i === data.page ? 'active' : ''}" onclick="loadReviews(${i})">${i}</button>`;
      }
      container.innerHTML = html;
    } else {
      container.innerHTML = '';
    }
  }

  async function viewReview(sid) {
    try {
      const data = await adminFetch(`/submissions/${sid}`);
      currentSubmission = data.data;
      const s = currentSubmission;

      const modalBody = document.getElementById('modal-body');
      document.getElementById('modal-title').textContent = `复核详情 · ${s.paper_title || '未知'} · ${s.question_type || ''}`;

      // 判断详情的身份
      const judgments = s.judgments || [];
      const judgmentsHtml = judgments.length ? judgments.map((j, i) => {
        const ok = j.status === 'completed';
        const tu = j.token_usage || {};
        return `
          <div class="review-judge-item">
            <div class="review-judge-name">${escapeHtml(j.model_name || '未知模型')}</div>
            <div class="review-judge-score">${ok ? (j.score_rate != null ? j.score_rate + '分' : '--') : '❌'}</div>
            <div class="review-judge-meta">
              ${ok ? escapeHtml(j.protocol || '') : escapeHtml(j.error_code || '失败')}
              ${tu.total_tokens ? ' · ' + tu.total_tokens.toLocaleString() + ' tokens' : ''}
              ${tu.cost ? ' · ¥' + tu.cost.toFixed(4) : ''}
            </div>
          </div>`;
      }).join('') : '<p style="color:#9ca3af;">无模型判断记录</p>';

      modalBody.innerHTML = `
        <div class="review-section">
          <div class="review-section-title">基本信息</div>
          <div class="review-grid">
            <div class="review-field">
              <label>用户</label>
              <span>${escapeHtml(s.nickname || s.username || '-')}</span>
            </div>
            <div class="review-field">
              <label>试卷</label>
              <span>${escapeHtml(s.paper_title || '-')}</span>
            </div>
            <div class="review-field" style="grid-column: 1 / -1;">
              <label>题目</label>
              <span>${escapeHtml(s.question_stem || '-')}</span>
            </div>
            ${s.reference_answer ? `
            <div class="review-field" style="grid-column: 1 / -1;">
              <label>参考答案</label>
              <div class="review-answer-box">${escapeHtml(s.reference_answer)}</div>
            </div>` : ''}
          </div>
        </div>

        <div class="review-section">
          <div class="review-section-title">评分对比</div>
          <div class="review-grid" style="grid-template-columns: 1fr 1fr 1fr;">
            <div class="review-field">
              <label>AI 评分</label>
              <span class="review-score">${s.score != null ? s.score + '分' : '--'}</span>
            </div>
            <div class="review-field">
              <label>复核评分</label>
              <span class="review-score" style="color: var(--color-success);">${s.review_score != null ? s.review_score + '分' : '--'}</span>
            </div>
            <div class="review-field">
              <label>状态</label>
              <span class="status-badge status-${s.review_status === 'approved' ? 'active' : s.review_status === 'rejected' ? 'rejected' : 'pending'}">${s.review_status === 'approved' ? '已确认' : s.review_status === 'rejected' ? '已拒绝' : '待复核'}</span>
            </div>
          </div>
        </div>

        <div class="review-section">
          <div class="review-section-title">模型判断</div>
          ${judgmentsHtml}
        </div>

        <div class="review-section">
          <div class="review-section-title">用户答案</div>
          <div class="review-answer-box">${escapeHtml(s.user_answer || '(无)')}</div>
        </div>

        ${s.ai_feedback ? `
        <div class="review-section">
          <div class="review-section-title">AI 反馈</div>
          <div class="review-answer-box">${escapeHtml(s.ai_feedback)}</div>
        </div>` : ''}

        <div class="review-section">
          <div class="review-section-title">复核操作</div>
          <form id="review-form" onsubmit="submitReview(event, '${sid}')">
            <div class="review-grid" style="grid-template-columns: 1fr 1fr;">
              <div class="review-field">
                <label>复核评分</label>
                <input type="number" id="review-score" class="admin-form-input" min="0" max="100" value="${s.score || 0}" step="0.1" required>
              </div>
              <div class="review-field">
                <label>复核状态</label>
                <select id="review-status" class="admin-form-input">
                  <option value="approved" ${s.review_status === 'approved' ? 'selected' : ''}>确认通过</option>
                  <option value="rejected" ${s.review_status === 'rejected' ? 'selected' : ''}>拒绝</option>
                  <option value="pending" ${s.review_status === 'pending' || !s.review_status ? 'selected' : ''}>待复核</option>
                </select>
              </div>
            </div>
            <div class="review-field" style="margin-top: 12px;">
              <label>复核意见</label>
              <textarea id="review-feedback" class="admin-form-input" style="min-height: 80px;" placeholder="复核意见（可选）">${escapeHtml(s.review_feedback || '')}</textarea>
            </div>
            <div style="margin-top: 16px; display: flex; gap: 10px; justify-content: flex-end;">
              <button type="button" class="btn btn-ghost" onclick="closeReviewModal()">取消</button>
              <button type="submit" class="btn btn-primary">保存复核</button>
            </div>
          </form>
        </div>
      `;

      document.getElementById('review-modal').classList.add('active');
    } catch (e) {
      showToast('加载失败', 'error');
    }
  }

  async function submitReview(e, sid) {
    e.preventDefault();
    const score = parseFloat(document.getElementById('review-score').value);
    const status = document.getElementById('review-status').value;
    const feedback = document.getElementById('review-feedback').value;

    try {
      await adminFetch(`/submissions/${sid}/review`, {
        method: 'PUT',
        body: JSON.stringify({ action: status, score, feedback })
      });
      showToast('复核已保存');
      closeReviewModal();
      loadReviews(currentPage);
    } catch (e) {
      showToast('操作失败', 'error');
    }
  }

  function closeReviewModal() {
    document.getElementById('review-modal').classList.remove('active');
    currentSubmission = null;
  }

  function formatDate(d) {
    if (!d) return '-';
    return new Date(d.replace(' ', 'T') + 'Z').toLocaleString('zh-CN');
  }

  loadReviews();
</script>
{% endblock %}

{% block extra_css %}
<style>
  .review-section {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e5e7eb;
  }
  .review-section:last-child { border-bottom: none; }
  .review-section-title {
    font-size: 14px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 12px;
  }
  .review-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .review-field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #6b7280;
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .review-field span {
    font-size: 14px;
    color: #111827;
  }
  .review-score {
    font-size: 28px !important;
    font-weight: 700 !important;
    color: var(--color-primary);
  }
  .review-answer-box {
    padding: 12px 14px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    font-size: 13.5px;
    line-height: 1.7;
    color: #374151;
    white-space: pre-wrap;
    max-height: 300px;
    overflow-y: auto;
  }
  .review-judge-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    background: #f9fafb;
    border: 1px solid #e5e7eb;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .review-judge-name {
    flex: 1;
    font-size: 13.5px;
    font-weight: 600;
    color: #111827;
  }
  .review-judge-score {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-primary);
  }
  .review-judge-meta {
    font-size: 12px;
    color: #9ca3af;
    min-width: 150px;
    text-align: right;
  }
</style>
{% endblock %}
