{% extends "admin/base.html" %}

{% block title %}用户管理 - 申论帮管理后台{% endblock %}
{% block page_title %}用户管理{% endblock %}

{% block admin_content %}
<!-- 筛选栏 -->
<div class="filter-bar">
  <div class="filter-item">
    <label>角色</label>
    <select id="filter-role" onchange="loadUsers()">
      <option value="">全部</option>
      <option value="user">普通用户</option>
      <option value="vip">VIP</option>
      <option value="admin">管理员</option>
    </select>
  </div>
  <div class="filter-item">
    <label>状态</label>
    <select id="filter-status" onchange="loadUsers()">
      <option value="">全部</option>
      <option value="active">正常</option>
      <option value="banned">已封禁</option>
    </select>
  </div>
  <div class="filter-item">
    <label>搜索</label>
    <input type="text" id="filter-search" placeholder="用户名/昵称" onkeyup="if(event.key==='Enter')loadUsers()">
  </div>
  <button class="btn btn-primary" onclick="loadUsers()">
    <i data-lucide="search"></i>
    搜索
  </button>
</div>

<!-- 用户列表 -->
<div class="admin-table-container">
  <div class="admin-table-header">
    <h3 class="admin-table-title">用户列表</h3>
  </div>
  <table class="admin-table">
    <thead>
      <tr>
        <th>用户ID</th>
        <th>用户名</th>
        <th>昵称</th>
        <th>角色</th>
        <th>批改次数</th>
        <th>VIP到期</th>
        <th>注册时间</th>
        <th>状态</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="users-table">
      <tr><td colspan="9" style="text-align: center;">加载中...</td></tr>
    </tbody>
  </table>
  <div class="admin-pagination">
    <div class="pagination-info" id="pagination-info">共 0 条</div>
    <div class="pagination-buttons" id="pagination-buttons"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  let currentPage = 1;

  async function loadUsers(page = 1) {
    currentPage = page;
    const role = document.getElementById('filter-role').value;
    const status = document.getElementById('filter-status').value;
    const search = document.getElementById('filter-search').value;

    const params = new URLSearchParams({ page, limit: 20 });
    if (role) params.append('role', role);
    if (status) params.append('status', status);
    if (search) params.append('search', search);

    try {
      const data = await adminFetch(`/users?${params}`);
      renderUsers(data.data);
    } catch (e) {
      document.getElementById('users-table').innerHTML =
        '<tr><td colspan="9" style="text-align: center;">加载失败</td></tr>';
    }
  }

  function renderUsers(data) {
    const tbody = document.getElementById('users-table');

    if (!data.users || data.users.length === 0) {
      tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">暂无数据</td></tr>';
      return;
    }

    tbody.innerHTML = data.users.map(user => `
      <tr>
        <td>${user.uid.substring(0, 8)}...</td>
        <td>${user.username}</td>
        <td>${user.nickname || '-'}</td>
        <td>
          ${user.role === 'admin' ? '<span class="badge badge-info">管理员</span>' :
            user.role === 'vip' ? '<span class="badge badge-accent" style="background: var(--color-accent);">VIP</span>' :
            '<span class="badge">用户</span>'}
        </td>
        <td style="cursor:pointer;" onclick="editCredits('${user.uid}', ${user.grading_credits || 0}, '${user.username}')" title="点击调整">
          ${user.grading_credits !== null && user.grading_credits !== undefined ? (user.grading_credits >= 9999 ? '无限' : user.grading_credits) : '0'}
          <i data-lucide="edit-2" style="width:12px;height:12px;margin-left:4px;color:#94a3b8;"></i>
        </td>
        <td>${user.vip_expire ? formatDate(user.vip_expire) : '-'}</td>
        <td>${formatDate(user.created_at)}</td>
        <td>
          ${user.status === 'active' ?
            '<span class="status-badge status-active">正常</span>' :
            '<span class="status-badge status-rejected">已封禁</span>'}
        </td>
        <td>
          <button class="action-btn action-btn-view" onclick="viewUser('${user.uid}')">查看</button>
          <button class="action-btn action-btn-edit" onclick="editUser('${user.uid}')">编辑</button>
          ${user.status === 'active' ?
            '<button class="action-btn action-btn-delete" onclick="banUser(\x27' + user.uid + '\x27)">封禁</button>' :
            '<button class="action-btn action-btn-edit" onclick="banUser(\x27' + user.uid + '\x27, \x27unban\x27)">解封</button>'}
        </td>
      </tr>
    `).join('');

    document.getElementById('pagination-info').textContent = `共 ${data.total} 条`;
    renderPagination(data);
    lucide.createIcons();
  }

  function renderPagination(data) {
    const container = document.getElementById('pagination-buttons');
    if (data.pages <= 1) {
      container.innerHTML = '';
      return;
    }

    let html = '';
    for (let i = 1; i <= data.pages; i++) {
      html += `<button class="pagination-btn ${i === data.page ? 'active' : ''}" onclick="loadUsers(${i})">${i}</button>`;
    }
    container.innerHTML = html;
  }

  function renderPkgBadge(pkg) {
    if (!pkg || !pkg.has_package || !pkg.badge_name) return '';
    const color = pkg.badge_color || '#f59e0b';
    return `<span style="display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:${color}15;color:${color};border:1px solid ${color};margin-left:8px;vertical-align:middle;">${pkg.badge_name}</span>`;
  }

  function renderPkgStatus(pkg) {
    if (!pkg || !pkg.has_package) return '<p style="color:#9ca3af;">无生效套餐</p>';
    let balance = '';
    if (pkg.package_type === 'time') {
      const days = pkg.remaining_days;
      const dayText = days === -1 ? '永久有效' : `剩余 ${days} 天`;
      if (pkg.daily_limit > 0) {
        const rt = pkg.remaining_today;
        balance = `今日剩 ${rt} / 每日${pkg.daily_limit}次 · ${dayText}`;
      } else {
        balance = `不限次 · ${dayText}`;
      }
    } else {
      balance = `剩余 ${pkg.remaining_credits} / ${pkg.total_credits || '?'} 次`;
    }
    const expiry = pkg.expires_at ? `（至 ${pkg.expires_at.substring(0, 10)}）` : '';
    return `<p style="font-weight:600;color:#111827;">${pkg.package_name}${renderPkgBadge(pkg)}</p>
            <p style="font-size:13px;color:#6b7280;margin-top:4px;">${balance}${expiry}</p>`;
  }

  function renderPkgHistory(history) {
    if (!history || !history.length) return '';
    const today = new Date().toISOString().substring(0, 10);
    const rows = history.slice(0, 5).map(h => {
      const typeLabel = h.package_type === 'time' ? '按天' : '按次';
      const statusLabel = h.is_active ? '<span style="color:#10b981;font-weight:600;">生效中</span>' : '<span style="color:#9ca3af;">已结束</span>';
      let detail;
      if (h.package_type === 'time') {
        if (h.daily_limit > 0) {
          const used = (h.daily_date === today) ? (h.daily_used || 0) : 0;
          detail = `每日${h.daily_limit}次 · 今日已用${used}`;
        } else {
          detail = '不限次';
        }
      } else {
        detail = `${h.remaining_credits}/${h.total_credits} 次`;
      }
      const expiry = h.expires_at ? h.expires_at.substring(0, 10) : '-';
      return `<tr>
        <td style="font-weight:550;">${h.package_name}</td>
        <td>${typeLabel}</td>
        <td>${detail}</td>
        <td style="font-size:12px;color:#6b7280;">${expiry}</td>
        <td style="font-size:12px;color:#6b7280;">${(h.redeemed_at || '').substring(0, 10)}</td>
        <td>${statusLabel}</td>
      </tr>`;
    }).join('');
    return `
      <div class="admin-form-group" style="margin-top:12px;">
        <label class="admin-form-label">套餐记录</label>
        <table class="admin-table" style="min-width:520px;margin-top:6px;">
          <thead><tr><th>套餐</th><th>类型</th><th>用量</th><th>到期</th><th>兑换日</th><th>状态</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  async function viewUser(uid) {
    try {
      const data = await adminFetch(`/users/${uid}`);
      const user = data.data;
      openModal('用户详情', `
        <div class="admin-form-group">
          <label class="admin-form-label">用户ID</label>
          <p>${user.uid}</p>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label class="admin-form-label">用户名</label>
            <p>${user.username}</p>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">昵称</label>
            <p>${user.nickname || '-'}</p>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label class="admin-form-label">角色</label>
            <p>${user.role}</p>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">状态</label>
            <p>${user.status}</p>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label class="admin-form-label">当前套餐</label>
            ${renderPkgStatus(user.package)}
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">通用批改次数</label>
            <p>${user.grading_credits !== null && user.grading_credits !== undefined ? (user.grading_credits >= 9999 ? '无限' : user.grading_credits) : '0'}</p>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label class="admin-form-label">提交次数</label>
            <p>${user.submissions_count || 0}</p>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">平均得分</label>
            <p>${user.avg_score ? user.avg_score + '分' : '-'}</p>
          </div>
        </div>
        <div class="admin-form-row">
          <div class="admin-form-group">
            <label class="admin-form-label">注册时间</label>
            <p>${formatDate(user.created_at)}</p>
          </div>
          <div class="admin-form-group">
            <label class="admin-form-label">最后登录</label>
            <p>${formatDate(user.last_login)}</p>
          </div>
        </div>
        ${renderPkgHistory(user.package_history)}
      `);
    } catch (e) {
      showToast('加载失败', 'error');
    }
  }

  async function banUser(uid, action = 'ban') {
    if (!confirm(`确定要${action === 'ban' ? '封禁' : '解封'}该用户吗？`)) return;

    try {
      await adminFetch(`/users/${uid}/ban`, {
        method: 'PUT',
        body: JSON.stringify({ action })
      });
      showToast(action === 'ban' ? '已封禁' : '已解封');
      loadUsers(currentPage);
    } catch (e) {
      showToast('操作失败', 'error');
    }
  }

  async function editUser(uid) {
    try {
      const data = await adminFetch(`/users/${uid}`);
      const user = data.data;

      openModal('编辑用户', `
        <form id="edit-user-form" onsubmit="saveUser(event, '${uid}')">
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">用户名</label>
              <p>${user.username}</p>
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">昵称</label>
              <input type="text" id="edit-nickname" class="input-field" value="${user.nickname || ''}">
            </div>
          </div>
          <div class="admin-form-row">
            <div class="admin-form-group">
              <label class="admin-form-label">角色</label>
              <select id="edit-role" class="input-field">
                <option value="user" ${user.role === 'user' ? 'selected' : ''}>普通用户</option>
                <option value="vip" ${user.role === 'vip' ? 'selected' : ''}>VIP</option>
                <option value="admin" ${user.role === 'admin' ? 'selected' : ''}>管理员</option>
                <option value="reviewer" ${user.role === 'reviewer' ? 'selected' : ''}>复核员</option>
                <option value="operator" ${user.role === 'operator' ? 'selected' : ''}>运维</option>
              </select>
            </div>
            <div class="admin-form-group">
              <label class="admin-form-label">VIP到期时间</label>
              <input type="date" id="edit-vip-expire" class="input-field" value="${user.vip_expire ? user.vip_expire.substring(0, 10) : ''}">
            </div>
          </div>
          <div style="text-align: right; margin-top: var(--space-3);">
            <button type="button" class="btn btn-secondary" onclick="closeModal()">取消</button>
            <button type="submit" class="btn btn-primary">保存</button>
          </div>
        </form>
      `);
    } catch (e) {
      showToast('加载失败', 'error');
    }
  }

  async function editCredits(uid, currentCredits, username) {
    const newCredits = prompt(`调整 [${username}] 的批改次数：\n当前：${currentCredits >= 9999 ? '无限' : currentCredits}\n输入新次数（管理员输入9999即为无限）：`, currentCredits >= 9999 ? '9999' : currentCredits);
    if (newCredits === null) return;
    const val = parseFloat(newCredits);
    if (isNaN(val) || val < 0) { showToast('请输入有效数字', 'error'); return; }
    try {
      await adminFetch(`/users/${uid}/credits`, {
        method: 'PUT',
        body: JSON.stringify({ credits: val })
      });
      showToast('已更新');
      loadUsers(currentPage);
    } catch (e) {
      showToast('更新失败', 'error');
    }
  }

  async function saveUser(e, uid) {
    e.preventDefault();
    const nickname = document.getElementById('edit-nickname').value;
    const role = document.getElementById('edit-role').value;
    const vipExpire = document.getElementById('edit-vip-expire').value;

    try {
      await adminFetch(`/users/${uid}`, {
        method: 'PUT',
        body: JSON.stringify({
          nickname,
          role,
          vip_expire: vipExpire || null
        })
      });
      showToast('保存成功');
      closeModal();
      loadUsers(currentPage);
    } catch (e) {
      showToast('保存失败', 'error');
    }
  }

  loadUsers();
</script>
{% endblock %}
