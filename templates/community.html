{% extends "base.html" %}
{% block title %}社区互助 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .cm-page { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 16px 0 56px; }

  /* 顶部标题条 */
  .cm-topbar { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:18px; }
  .cm-topbar h1 { margin:0; font-size:1.4rem; font-weight:750; color:#0f172a; }
  .cm-topbar p { margin:2px 0 0; font-size:13px; color:#94a3b8; }
  .cm-publish-btn {
    display:inline-flex; align-items:center; gap:6px; min-height:42px; padding:0 20px;
    border-radius:999px; border:none; background:linear-gradient(135deg,#0b6fbe,#0c8ee7);
    color:#fff; font-size:14px; font-weight:700; cursor:pointer;
    box-shadow:0 6px 16px rgba(12,142,231,.28);
  }
  .cm-publish-btn:hover { filter:brightness(1.05); transform:none!important; }

  /* 两栏布局 */
  .cm-layout { display:grid; grid-template-columns: 260px 1fr; gap:18px; align-items:start; }

  /* 左侧边栏 */
  .cm-side { position:sticky; top:16px; display:grid; gap:14px; }
  .cm-side-card {
    background:#fff; border:1px solid #e3eef9; border-radius:14px; padding:14px;
    box-shadow:0 3px 10px rgba(12,142,231,.04);
  }
  .cm-side-title { margin:0 0 10px; font-size:12px; font-weight:700; color:#94a3b8; letter-spacing:.5px; text-transform:uppercase; }
  .cm-side-publish {
    width:100%; min-height:44px; border-radius:10px; border:1px dashed #b7d7f3;
    background:#f7fbff; color:#0b4f8a; font-size:14px; font-weight:650; cursor:pointer;
  }
  .cm-side-publish:hover { border-color:#0c8ee7; background:#eaf4ff; transform:none!important; }
  .cm-cat-list { display:grid; gap:4px; }
  .cm-cat {
    display:flex; align-items:center; gap:8px; min-height:38px; padding:0 12px;
    border-radius:10px; border:none; background:transparent; color:#475569;
    font-size:13.5px; font-weight:600; cursor:pointer; text-align:left; width:100%;
  }
  .cm-cat:hover { background:#f1f7fd; transform:none!important; }
  .cm-cat.active { background:#eaf4ff; color:#0b4f8a; }
  .cm-cat .dot { width:8px; height:8px; border-radius:50%; }
  .cm-stat-row { display:flex; justify-content:space-between; font-size:13px; color:#475569; padding:6px 0; }
  .cm-stat-row b { color:#0f172a; }

  /* 右侧主区 */
  .cm-main { display:grid; gap:14px; min-width:0; }

  /* 精选横滑条 */
  .cm-featured-wrap { display:none; }
  .cm-featured-wrap.has { display:block; }
  .cm-featured { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x mandatory; }
  .cm-featured-item {
    flex:0 0 280px; scroll-snap-align:start;
    background:linear-gradient(135deg,#0b4f8a,#0c8ee7); color:#fff;
    border-radius:14px; padding:16px; cursor:pointer;
  }
  .cm-featured-item:hover { transform:none!important; filter:brightness(1.03); }
  .cm-featured-badge { display:inline-flex; height:20px; padding:0 9px; border-radius:999px; background:rgba(255,255,255,.2); font-size:11px; font-weight:700; margin-bottom:8px; }
  .cm-featured-title { font-size:14px; font-weight:700; margin-bottom:6px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cm-featured-content { font-size:12.5px; line-height:1.6; opacity:.9; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cm-featured-meta { font-size:11.5px; opacity:.78; }

  /* 工具栏 */
  .cm-toolbar {
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:#fff; border:1px solid #e3eef9; border-radius:12px; padding:10px 14px;
  }
  .cm-sorts { display:flex; gap:4px; }
  .cm-sort {
    border:none; background:transparent; color:#94a3b8; font-size:13px; cursor:pointer; font-weight:650;
    padding:6px 12px; border-radius:8px;
  }
  .cm-sort.active { color:#0c8ee7; background:#eaf4ff; }
  .cm-count { font-size:12.5px; color:#94a3b8; }

  /* 帖子列表 */
  .cm-list { display:grid; gap:12px; }
  .cm-post {
    background:#fff; border:1px solid #e3eef9; border-radius:14px; padding:16px 18px; cursor:pointer;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .cm-post:hover { border-color:rgba(12,142,231,.35); box-shadow:0 8px 20px rgba(12,142,231,.08); transform:none!important; }
  .cm-post-top { display:flex; align-items:center; gap:8px; margin-bottom:9px; flex-wrap:wrap; }
  .cm-type { display:inline-flex; align-items:center; height:22px; padding:0 9px; border-radius:999px; font-size:11.5px; font-weight:700; color:#fff; }
  .type-answer_share { background:#059669; }
  .type-question { background:#d97706; }
  .type-discussion { background:#0c8ee7; }
  .type-tips { background:#7c3aed; }
  .cm-nick { font-size:12.5px; color:#94a3b8; }
  .cm-post-title { margin:0 0 6px; font-size:1.02rem; font-weight:700; color:#0f172a; line-height:1.45; }
  .cm-post-content {
    margin:0 0 11px; font-size:13.5px; line-height:1.7; color:#64748b;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .cm-post-foot { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:#94a3b8; }
  .cm-star { color:#0c8ee7; font-weight:700; }

  .cm-empty { text-align:center; padding:46px 16px; border:1px dashed #d7e6f5; border-radius:14px; color:#64748b; background:#fafcff; }

  /* 弹窗（发帖 + 详情共用） */
  .cm-overlay { position:fixed; inset:0; z-index:200; display:none; align-items:center; justify-content:center; background:rgba(15,23,42,.45); backdrop-filter:blur(4px); padding:16px; }
  .cm-overlay.show { display:flex; }
  .cm-modal { width:min(560px,100%); max-height:88vh; overflow:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; background:#fff; border-radius:16px; border:1px solid #d7e6f5; box-shadow:0 20px 48px rgba(15,23,42,.2); padding:22px 24px; }
  .cm-modal.wide { width:min(720px,100%); }
  .cm-modal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .cm-modal-head h3 { margin:0; font-size:1.05rem; font-weight:750; color:#0f172a; }
  .cm-close { width:32px; height:32px; border:0; border-radius:8px; background:#f1f5f9; color:#64748b; font-size:20px; cursor:pointer; }
  .cm-form-row { display:grid; grid-template-columns:1fr 1.4fr; gap:12px; margin-bottom:12px; }
  .cm-form-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
  .cm-form-actions .btn { min-width:84px; }
  .cm-detail-title { margin: 0 40px 10px 0; font-size:1.2rem; font-weight:750; color:#0f172a; line-height:1.4; }
  .cm-detail-meta { font-size:12.5px; color:#94a3b8; margin-bottom:16px; }
  .cm-detail-content {
    font-size:14.5px; line-height:1.8; color:#334155; white-space:pre-wrap; margin-bottom:18px;
    padding: 14px 16px; background:#f7fbff; border:1px solid #e3eef9; border-radius:12px;
  }
  .cm-like {
    min-height:36px; padding:0 14px; border-radius:10px; border:1px solid #d7e6f5;
    background:#fff; cursor:pointer; font-size:13.5px; color:#475569;
  }
  .cm-like.liked { border-color:#fecaca; color:#dc2626; background:#fef2f2; }
  .cm-comments { margin-top:18px; border-top:1px solid #eef4fb; padding-top:16px; }
  .cm-comment { padding:12px 0; border-bottom:1px solid #f1f5f9; }
  .cm-comment-head { display:flex; justify-content:space-between; margin-bottom:6px; }
  .cm-comment-nick { font-size:12.5px; font-weight:700; color:#0f172a; }
  .cm-comment-time { font-size:12px; color:#94a3b8; }
  .cm-comment-body { font-size:13.5px; line-height:1.65; color:#475569; }
  .cm-comment-form { display:flex; gap:10px; margin-top:14px; }
  .cm-comment-form textarea {
    flex:1; min-height:70px; border:1px solid #d7e6f5; border-radius:10px;
    padding:10px 12px; font:inherit; color:#0f172a; background:#fff; resize:vertical;
  }

  /* 删除按钮（低调、靠右、悬停显红） */
  .cm-delete-btn {
    margin-left:auto; border:none; background:transparent; color:#94a3b8;
    font-size:12px; cursor:pointer; padding:2px 8px; border-radius:8px;
  }
  .cm-delete-btn:hover { color:#dc2626; background:#fef2f2; }
  .cm-delete-comment { margin-left:8px; }
  .cm-pin-badge {
    display:inline-flex; align-items:center; height:20px; padding:0 8px; margin-left:6px;
    border-radius:999px; background:#fef3c7; color:#b45309; font-size:11px; font-weight:700;
  }
  .cm-detail-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:4px; }
  .cm-comment-actions { margin-top:6px; }
  .cm-mini-like {
    border:none; background:transparent; color:#64748b; font-size:12px; cursor:pointer; padding:2px 6px; border-radius:8px;
  }
  .cm-mini-like:hover { background:#f1f5f9; }

@media (max-width: 860px) {
    .cm-layout { grid-template-columns: 1fr; }
    .cm-side { position:static; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .cm-side-card:nth-child(3) { grid-column:1/-1; }
    .cm-featured-item { flex-basis: 78vw; }
  }
  @media (max-width: 560px) {
    .cm-side { grid-template-columns:1fr; }
    .cm-topbar { flex-direction:column; align-items:flex-start; }
    .cm-publish-btn { width:100%; justify-content:center; }
    .cm-form-row { grid-template-columns:1fr; }
  }
</style>
{% endblock %}

{% block content %}
<div class="page-container">
  <div class="cm-page">
    <div class="cm-topbar">
      <div>
        <h1>社区互助</h1>
        <p>晒答案、提问题、交流备考经验</p>
      </div>
      <button class="cm-publish-btn" type="button" onclick="openCreateModal()">✍ 发布新帖</button>
    </div>

    <div class="cm-layout">
      <!-- 左侧边栏 -->
      <aside class="cm-side">
        <div class="cm-side-card">
          <button class="cm-side-publish" type="button" onclick="openCreateModal()">+ 发布新帖</button>
        </div>
        <div class="cm-side-card">
          <h3 class="cm-side-title">分类</h3>
          <div class="cm-cat-list" id="catList">
            <button class="cm-cat active" data-type="" onclick="filterType('', this)"><span>全部</span></button>
            <button class="cm-cat" data-type="answer_share" onclick="filterType('answer_share', this)"><span class="dot" style="background:#059669"></span>晒答案</button>
            <button class="cm-cat" data-type="question" onclick="filterType('question', this)"><span class="dot" style="background:#d97706"></span>求助</button>
            <button class="cm-cat" data-type="discussion" onclick="filterType('discussion', this)"><span class="dot" style="background:#0c8ee7"></span>讨论</button>
            <button class="cm-cat" data-type="tips" onclick="filterType('tips', this)"><span class="dot" style="background:#7c3aed"></span>备考经验</button>
          </div>
        </div>
        <div class="cm-side-card" id="sideStats" style="display:none;">
          <h3 class="cm-side-title">社区数据</h3>
          <div class="cm-stat-row"><span>帖子总数</span><b id="statTotal">0</b></div>
          <div class="cm-stat-row"><span>当前页</span><b id="statPage">1</b></div>
        </div>
      </aside>

      <!-- 右侧主区 -->
      <main class="cm-main">
        <div class="cm-featured-wrap" id="featuredSection">
          <div class="cm-featured" id="featuredList"></div>
        </div>

        <div class="cm-toolbar">
          <div class="cm-sorts">
            <button class="cm-sort active" onclick="changeSort('latest', this)">最新</button>
            <button class="cm-sort" onclick="changeSort('hot', this)">最热</button>
            <button class="cm-sort" onclick="changeSort('featured', this)">精选</button>
          </div>
          <span class="cm-count" id="postCount">加载中...</span>
        </div>

        <div class="cm-list" id="postList">
          <div class="cm-empty"><div class="spinner" style="margin:0 auto"></div></div>
        </div>
      </main>
    </div>
  </div>
</div>

<!-- 发帖弹窗 -->
<div class="cm-overlay" id="createOverlay" onclick="closeCreateModal(event)">
  <div class="cm-modal" onclick="event.stopPropagation()">
    <div class="cm-modal-head">
      <h3>发布新帖</h3>
      <button class="cm-close" type="button" onclick="closeCreateModal()">&times;</button>
    </div>
    <div class="cm-form-row">
      <div class="form-group" style="margin:0;">
        <label class="form-label">帖子类型</label>
        <select class="input-field" id="postType">
          <option value="answer_share">晒答案</option>
          <option value="question">求助</option>
          <option value="discussion">讨论</option>
          <option value="tips">备考经验</option>
        </select>
      </div>
      <div class="form-group" style="margin:0;">
        <label class="form-label">标题（选填）</label>
        <input type="text" class="input-field" id="postTitle" placeholder="一句话概括" maxlength="60">
      </div>
    </div>
    <div class="form-group" style="margin:0 0 8px;">
      <label class="form-label">内容</label>
      <textarea class="input-field" id="postContent" style="min-height:140px;" placeholder="分享你的答案、提出问题、交流备考心得..." maxlength="5000"></textarea>
    </div>
    <div class="cm-form-actions">
      <button class="btn btn-secondary" type="button" onclick="closeCreateModal()">取消</button>
      <button class="btn btn-primary" type="button" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>

<!-- 帖子详情弹窗 -->
<div class="cm-overlay" id="detailOverlay" onclick="closeDetail(event)">
  <div class="cm-modal wide" onclick="event.stopPropagation()">
    <button class="cm-close" type="button" onclick="hideOverlay('detailOverlay')">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const API = '/api/community';
const token = localStorage.getItem('slb_token') || localStorage.getItem('token') || '';
const headers = () => ({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'});
let currentType = '';
let currentSort = 'latest';
let me = null;  // 当前用户信息 {uid, role}

// 页面加载时获取当前用户，用于判断删帖/删评论权限
async function loadMe() {
  if (!token) return;
  try {
    const res = await fetch('/api/auth/me', {headers: headers()});
    const data = await res.json();
    me = data.data || null;
  } catch (e) { me = null; }
}

// 当前用户是否可管理该资源（作者本人或管理员）
function canManage(ownerUid) {
  if (!me) return false;
  if (me.role === 'admin' || me.role === 'super_admin') return true;
  return me.uid === ownerUid;
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function loadFeatured() {
  try {
    const res = await fetch(API + '/featured?limit=6');
    const data = await res.json();
    const items = data.data?.items || [];
    const wrap = document.getElementById('featuredSection');
    if (!items.length) { wrap.classList.remove('has'); return; }
    wrap.classList.add('has');
    document.getElementById('featuredList').innerHTML = items.map(p => `
      <div class="cm-featured-item" onclick="viewPost(${p.post_id})">
        <span class="cm-featured-badge">★ 精选</span>
        <div class="cm-featured-title">${escapeHtml(p.title || (p.content || '').substring(0, 50))}</div>
        <div class="cm-featured-content">${escapeHtml((p.content || '').substring(0, 90))}...</div>
        <div class="cm-featured-meta">${escapeHtml(p.nickname || '')} · ${p.like_count || 0}赞 · ${p.comment_count || 0}评论</div>
      </div>`).join('');
  } catch (e) {}
}

async function loadPosts(page = 1) {
  const params = new URLSearchParams({page, limit: 20, sort: currentSort});
  if (currentType) params.append('type', currentType);
  const h = token ? headers() : {'Content-Type': 'application/json'};
  try {
    const res = await fetch(API + '/posts?' + params, {headers: h});
    const data = await res.json();
    const list = document.getElementById('postList');
    const items = data.data?.items || [];
    const total = data.data?.total || 0;
    document.getElementById('postCount').textContent = `共 ${total} 篇`;
    const stats = document.getElementById('sideStats');
    if (stats) {
      stats.style.display = '';
      document.getElementById('statTotal').textContent = total;
      document.getElementById('statPage').textContent = data.data?.page || 1;
    }
    if (!items.length) {
      list.innerHTML = `
        <div class="cm-empty">
          <p style="font-size:15px;font-weight:700;color:#0f172a;margin:0 0 8px">还没有帖子</p>
          <p style="margin:0 0 16px">成为第一个分享的人吧</p>
          <button class="btn btn-primary btn-sm" onclick="openCreateModal()">发布新帖</button>
        </div>`;
      return;
    }
    list.innerHTML = items.map(p => `
      <div class="cm-post" onclick="viewPost(${p.post_id})">
        <div class="cm-post-top">
          <span class="cm-type type-${escapeHtml(p.post_type || '')}">${escapeHtml(p.post_type_name || '')}</span>
          <span class="cm-nick">${escapeHtml(p.nickname || '')}</span>
          ${p.is_pinned ? '<span class="cm-pin-badge">置顶</span>' : ''}
          ${canManage(p.uid) ? `<button class="cm-delete-btn" type="button" title="删除帖子" onclick="event.stopPropagation();deletePost(${p.post_id})">删除</button>` : ''}
        </div>
        ${p.title ? `<div class="cm-post-title">${escapeHtml(p.title)}</div>` : ''}
        <div class="cm-post-content">${escapeHtml(p.content || '')}</div>
        <div class="cm-post-foot">
          ${p.is_featured ? '<span class="cm-star">★ 精选</span>' : ''}
          <span>${p.view_count || 0} 浏览</span>
          <span>${p.like_count || 0} 赞</span>
          <span>${p.comment_count || 0} 评论</span>
          <span>${timeAgo(p.created_at)}</span>
        </div>
      </div>`).join('');
  } catch (e) {
    document.getElementById('postList').innerHTML = '<div class="cm-empty">加载失败，请刷新重试</div>';
  }
}

function filterType(type, btn) {
  currentType = type;
  document.querySelectorAll('.cm-cat').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  loadPosts();
}
function changeSort(sort, btn) {
  currentSort = sort;
  document.querySelectorAll('.cm-sort').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  loadPosts();
}

// ===== 弹窗滚动锁（组合方案）=====
// 页面用了 Lenis 平滑滚动库，Lenis 监听 wheel 时无视 defaultPrevented，
// 单独靠 preventDefault 拦不住它。因此组合三重手段：
//  1. 停掉 Lenis（存在时 stop()，它就不再滚页面）
//  2. 遮罩上捕获 wheel/touch：preventDefault 拦原生滚动 + 手动滚动弹窗内容
//  3. html/body overflow:hidden 兜底（覆盖滚动容器不是 body 的极端情况）
let _overlayScrollCleanup = null;
function _lockOverlayScroll(overlay) {
  try { if (window.__lenis) window.__lenis.stop(); } catch (e) {}
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';

  const modal = overlay.querySelector('.cm-modal');
  if (!modal) return () => _unlockOverlayScroll();
  const onWheel = (e) => {
    e.preventDefault();  // 拦原生滚动（Lenis 已 stop，不会再收到/不会滚）
    const max = modal.scrollHeight - modal.clientHeight;
    let next = modal.scrollTop + e.deltaY;
    if (next < 0) next = 0;
    if (next > max) next = max;
    modal.scrollTop = next;  // 手动滚动弹窗内容，保证一定能滚
  };
  const onTouchMove = (e) => {
    const max = modal.scrollHeight - modal.clientHeight;
    if (max <= 0) e.preventDefault();  // 弹窗内容不满：阻止触摸穿透
    // 有滚动空间时交给原生触摸滚动，边界由 overscroll-behavior:contain 兜底
  };
  overlay.addEventListener('wheel', onWheel, { passive: false });
  overlay.addEventListener('touchmove', onTouchMove, { passive: false });
  return () => {
    overlay.removeEventListener('wheel', onWheel);
    overlay.removeEventListener('touchmove', onTouchMove);
    _unlockOverlayScroll();
  };
}
function _unlockOverlayScroll() {
  try { if (window.__lenis) window.__lenis.start(); } catch (e) {}
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
}
function _releaseOverlayScroll() {
  if (_overlayScrollCleanup) {
    _overlayScrollCleanup();
    _overlayScrollCleanup = null;
  }
}
function showOverlay(id) {
  const overlay = document.getElementById(id);
  if (!overlay) return;
  overlay.classList.add('show');
  _releaseOverlayScroll();
  _overlayScrollCleanup = _lockOverlayScroll(overlay);
}
function hideOverlay(id) {
  document.getElementById(id)?.classList.remove('show');
  _releaseOverlayScroll();
}

// 发帖弹窗
function openCreateModal() {
  if (!token) { showToast('请先登录', 'error'); openAuthModal('login'); return; }
  showOverlay('createOverlay');
  setTimeout(() => document.getElementById('postContent')?.focus(), 50);
}
function closeCreateModal(e) {
  if (e && e.target !== e.currentTarget) return;  // 点遮罩外才关闭
  hideOverlay('createOverlay');
}
// ESC 关闭弹窗
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    hideOverlay('createOverlay');
    hideOverlay('detailOverlay');
  }
});

async function submitPost() {
  if (!token) { showToast('请先登录', 'error'); openAuthModal('login'); return; }
  const post_type = document.getElementById('postType').value;
  const title = document.getElementById('postTitle').value.trim();
  const content = document.getElementById('postContent').value.trim();
  if (!content) { showToast('请输入内容', 'error'); return; }
  const res = await fetch(API + '/posts', {
    method: 'POST', headers: headers(),
    body: JSON.stringify({post_type, title, content})
  });
  const data = await res.json();
  if (data.error) { showToast(data.error, 'error'); return; }
  showToast('发布成功');
  document.getElementById('postContent').value = '';
  document.getElementById('postTitle').value = '';
  closeCreateModal();
  loadPosts();
  loadFeatured();
}

async function viewPost(id) {
  const h = token ? headers() : {'Content-Type': 'application/json'};
  const res = await fetch(API + '/posts/' + id, {headers: h});
  const data = await res.json();
  if (!data.data) return;
  renderDetail(data.data);
  showOverlay('detailOverlay');
}

function renderDetail(p) {
  const isPostOwner = canManage(p.uid);
  let html = `<div class="cm-detail-head">
    <div>
      <div class="cm-detail-title">${escapeHtml(p.title || p.post_type_name || '帖子详情')}</div>
      <div class="cm-detail-meta">${escapeHtml(p.nickname || '')} · ${timeAgo(p.created_at)} · ${p.view_count || 0}浏览 · ${p.like_count || 0}赞 · ${p.comment_count || 0}评论</div>
    </div>
    ${isPostOwner ? `<button class="cm-delete-btn" type="button" onclick="deletePost(${p.post_id})">删除帖子</button>` : ''}
  </div>`;
  html += `<div class="cm-detail-content">${escapeHtml(p.content || '')}</div>`;
  html += `<button class="cm-like${p.is_liked ? ' liked' : ''}" onclick="togglePostLike(${p.post_id})">${p.is_liked ? '已赞' : '点赞'} ${p.like_count || 0}</button>`;
  html += `<div class="cm-comments"><h4 style="margin:0 0 12px;font-size:14px;color:#0f172a">评论 (${(p.comments || []).length})</h4>`;
  (p.comments || []).forEach(c => {
    const canDelComment = canManage(c.uid);
    html += `<div class="cm-comment">
      <div class="cm-comment-head">
        <span class="cm-comment-nick">${escapeHtml(c.nickname || '')}</span>
        <span class="cm-comment-time">${timeAgo(c.created_at)}</span>
        ${canDelComment ? `<button class="cm-delete-btn cm-delete-comment" type="button" onclick="deleteComment(${c.comment_id}, ${p.post_id})">删除</button>` : ''}
      </div>
      <div class="cm-comment-body">${escapeHtml(c.content || '')}</div>
      <div class="cm-comment-actions">
        <button type="button" class="cm-mini-like" onclick="toggleCommentLike(${c.comment_id}, ${p.post_id})">👍 ${c.like_count || 0}</button>
      </div>
    </div>`;
  });
  if (token) {
    html += `<div class="cm-comment-form"><textarea id="commentInput" placeholder="写下你的评论..."></textarea><button class="btn btn-primary btn-sm" onclick="submitComment(${p.post_id})">发送</button></div>`;
  }
  html += '</div>';
  document.getElementById('detailContent').innerHTML = html;
}

async function togglePostLike(postId) {
  if (!token) { showToast('请先登录', 'error'); openAuthModal('login'); return; }
  await fetch(API + '/post/' + postId + '/like', {method: 'POST', headers: headers()});
  viewPost(postId);
}

async function toggleCommentLike(commentId, postId) {
  if (!token) { showToast('请先登录', 'error'); openAuthModal('login'); return; }
  await fetch(API + '/comment/' + commentId + '/like', {method: 'POST', headers: headers()});
  viewPost(postId);
}

async function deletePost(postId) {
  if (!confirm('确定删除这条帖子吗？删除后不可恢复。')) return;
  const res = await fetch(API + '/posts/' + postId, {method: 'DELETE', headers: headers()});
  const data = await res.json();
  if (data.error) { showToast(data.error, 'error'); return; }
  showToast('已删除');
  hideOverlay('detailOverlay');
  loadPosts();
  loadFeatured();
}

async function deleteComment(commentId, postId) {
  if (!confirm('确定删除这条评论吗？')) return;
  const res = await fetch(API + '/comments/' + commentId, {method: 'DELETE', headers: headers()});
  const data = await res.json();
  if (data.error) { showToast(data.error, 'error'); return; }
  showToast('评论已删除');
  viewPost(postId);
  loadPosts();
}
async function submitComment(postId) {
  const input = document.getElementById('commentInput');
  const content = (input?.value || '').trim();
  if (!content) return;
  await fetch(API + '/posts/' + postId + '/comments', {
    method: 'POST', headers: headers(), body: JSON.stringify({content})
  });
  viewPost(postId);
}
function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay')) {
    hideOverlay('detailOverlay');
  }
}
function timeAgo(dt) {
  if (!dt) return '';
  const diff = (Date.now() - new Date(dt).getTime()) / 1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return Math.floor(diff/60) + '分钟前';
  if (diff < 86400) return Math.floor(diff/3600) + '小时前';
  if (diff < 604800) return Math.floor(diff/86400) + '天前';
  return String(dt).substring(0, 10);
}

(async () => {
  await loadMe();
  loadFeatured();
  loadPosts();
})();
</script>
{% endblock %}
