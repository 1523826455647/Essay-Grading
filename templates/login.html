{% extends "base.html" %}

{% block title %}登录 - 申论帮{% endblock %}

{% block extra_css %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 64px); display:grid; place-items:center; padding: 32px 16px;
    background:
      radial-gradient(700px 280px at 15% 0%, rgba(12,142,231,.12), transparent 60%),
      linear-gradient(180deg, #f7fbff, #f3f7fc);
  }
  .auth-box { width: min(420px, 100%); }
  .auth-logo {
    width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 16px;
    display:grid; place-items:center; color:#fff; font-size:22px; font-weight:800;
    background: linear-gradient(180deg,#1aa0f0,#0c8ee7);
    box-shadow: 0 10px 24px rgba(12,142,231,.28);
  }
  .auth-box h1 { text-align:center; margin:0 0 8px; font-size:1.5rem; color:#0f172a; }
  .auth-box .auth-sub { text-align:center; margin:0 0 22px; color:#64748b; font-size:14px; }
  .auth-card { padding: 28px !important; border-radius: 18px !important; }
  .auth-card .btn-primary { width:100%; min-height:46px; margin-top: 4px; }
  .auth-foot { margin-top: 18px; text-align:center; font-size:14px; color:#64748b; }
  .auth-foot a { color:#0c8ee7; font-weight:650; text-decoration:none; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">申</div>
    <h1>登录申论帮</h1>
    <p class="auth-sub">AI 智能批改，助你高效备考</p>

    <div class="card auth-card">
      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input type="text" id="username" name="username" class="input-field" placeholder="请输入用户名" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label">密码</label>
          <div style="position: relative;">
            <input type="password" id="password" name="password" class="input-field" placeholder="请输入密码" required>
            <button type="button" onclick="togglePassword()" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--color-text-muted); cursor: pointer; padding: 4px;">
              <i data-lucide="eye" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
        </div>

        <div id="login-error" style="display: none; color: var(--color-error); font-size: var(--text-sm); margin-bottom: var(--space-4);"></div>

        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px; font-size: var(--text-base);">
          登录
        </button>
      </form>

      <div class="auth-foot">
        还没有账号？<a href="/register">立即注册</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  // 切换密码可见性
  function togglePassword() {
    const input = document.getElementById('password');
    const icon = input.parentElement.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye-off');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye');
    }
    if (typeof lucide !== 'undefined') {
      lucide.createIcons();
    }
  }

  // 登录
  async function handleLogin(e) {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button[type="submit"]');

    if (!username || !password) {
      errorEl.textContent = '请输入用户名和密码';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.innerHTML = '<div class="grading-status-spinner" style="width:16px;height:16px;border-width:2px;margin:0 auto;"></div>';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();

      if (res.ok && data.data) {
        // 保存 token
        localStorage.setItem('token', data.data.token);
        localStorage.setItem('user', JSON.stringify(data.data.user));

        if (typeof SLBToast !== 'undefined') {
          SLBToast.success('登录成功');
        }

        // 跳转
        setTimeout(() => {
          window.location.href = '/';
        }, 500);
      } else {
        errorEl.textContent = data.error || '登录失败';
        errorEl.style.display = 'block';
        btn.disabled = false;
        btn.innerHTML = '登录';
      }
    } catch (e) {
      console.error('Login error:', e);
      errorEl.textContent = '网络错误，请稍后重试';
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.innerHTML = '登录';
    }
  }
</script>
{% endblock %}
